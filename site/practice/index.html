<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Cipher League: A fantasy cybersecurity strategy game. Draft security talent, set a lineup, and outscore rival operations." />
  <meta property="og:title" content="Cipher League — Fantasy Cybersecurity" />
  <meta property="og:description" content="Draft your cyber dream team. Own the leaderboard. Defend your dynasty." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Cipher League — Fantasy Cybersecurity</title>
</head>
<body>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" aria-label="Cipher League home">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 36 11v18L20 38 4 29V11z" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="m25.5 12-10 8 10 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span><strong>CIPHER<span>LEAGUE</span></strong><small>FANTASY CYBERSECURITY</small></span>
      </a>
      <div class="sidebar-section-label">COMMAND CENTER</div>
      <nav id="side-nav" class="side-nav"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-promo">
        <span class="sidebar-promo-icon">✳</span>
        <div class="sidebar-promo-heading">Think like a CISO.</div>
        <p>Draft smarter. Stack your skills. Dominate the league.</p>
        <button class="promo-link" data-view="howto">How to play <span>↗</span></button>
      </div>
      <div class="sidebar-profile">
        <div class="profile-avatar">GP</div>
        <div><strong id="profile-team">Ghost Protocol</strong><span>League Manager</span></div>
        <span class="online-dot"></span>
      </div>
    </aside>
    <div class="mobile-scrim" id="mobile-scrim"></div>
    <div class="content-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu" class="icon-button mobile-menu" aria-label="Open menu">☰</button>
          <span class="crumb-root">LEAGUE /</span><span id="crumb-current" class="crumb-current">OVERVIEW</span>
        </div>
        <div class="topbar-right">
          <span class="live-pill"><span></span> SEASON 01</span>
          <div class="topbar-divider"></div>
          <span class="week-display" id="header-week">WEEK 01 <span>▼</span></span>
          <span class="topbar-avatar">GP</span>
        </div>
      </header>
      <main class="main" id="main-view" tabindex="-1"></main>
      <footer class="site-footer"><span>© 2026 CIPHER LEAGUE</span><span>SIMULATED SCORING · NO REAL INCIDENT DATA</span><span>BUILD 1.0.0</span></footer>
    </div>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden />
  <script src="./app.js" defer></script>
</body>
</html>
